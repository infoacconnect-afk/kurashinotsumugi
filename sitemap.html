<style>
.sitemap-hero { background: linear-gradient(180deg, #FBF7F0 0%, #F3ECE0 100%); }
.sitemap-body { background: #fff; padding: 80px 0 120px; }
.sitemap-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 40px;
  max-width: 900px;
  margin: 0 auto;
}
.sitemap-block {
  background: var(--ivory);
  border-radius: 24px;
  padding: 40px;
  transition: all .3s var(--ease);
  border: 1px solid var(--line-soft);
}
.sitemap-block:hover { box-shadow: var(--shadow-md); }
.sitemap-block h2 {
  font-size: 20px;
  color: var(--brown-deep);
  margin-bottom: 24px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--orange-soft);
  display: flex; align-items: center; gap: 12px;
}
.sitemap-block h2 .num {
  font-family: 'Zen Maru Gothic', sans-serif;
  color: var(--orange-deep);
  font-size: 24px;
}
.sitemap-block ul { list-style: none; padding: 0; margin: 0; }
.sitemap-block li { margin-bottom: 12px; }
.sitemap-block a {
  color: var(--text);
  font-size: 15px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: all .3s var(--ease);
  padding: 8px 0;
}
.sitemap-block a::before {
  content: '›';
  color: var(--orange);
  font-weight: 700;
}
.sitemap-block a:hover {
  color: var(--brown-deep);
  padding-left: 8px;
  opacity: 1;
}
.sitemap-block .sub-list {
  padding-left: 24px;
  margin-top: 4px;
  border-left: 1px dashed var(--brown-soft);
}
.sitemap-block .sub-list li { margin-bottom: 4px; }
.sitemap-block .sub-list a { font-size: 14px; color: var(--text-soft); padding: 4px 0; }
@media (max-width: 700px) { .sitemap-grid { grid-template-columns: 1fr; } }
</style>
</head>
