<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>住資産再生ラボ｜くらしのつむぎ</title>
<meta name="description" content="住まいの"これから"を、やさしく学べる場所。空き家、相続、税金、活用事例を、暮らしに寄り添う言葉でお届けします。">
<link rel="icon" href="assets/logo-white.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
<style>
.hero-lab { background: linear-gradient(180deg, #F7F9F2 0%, #FBF7F0 100%); }

.pickup-sec { background: #fff; padding: 80px 0; }
.pickup-card {
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 48px;
  align-items: center;
  background: linear-gradient(135deg, #FBF7F0 0%, #F5E8D0 100%);
  border-radius: 32px;
  padding: 48px;
  overflow: hidden;
}
.pickup-card .pu-thumb {
  aspect-ratio: 4/3;
  border-radius: 20px;
  overflow: hidden;
  background: #fff;
}
.pickup-card .pu-thumb svg,
.pickup-card .pu-thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
.pickup-badge {
  display: inline-block;
  background: var(--orange);
  color: #fff;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 12px;
  letter-spacing: 0.12em;
  font-weight: 600;
  margin-bottom: 20px;
}
.pickup-card h2 {
  font-size: clamp(24px, 3vw, 30px);
  color: var(--brown-deep);
  line-height: 1.6;
  margin-bottom: 20px;
}
.pickup-card .pu-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  font-size: 13px;
}
.pickup-card .pu-meta .cat {
  background: var(--green-soft);
  color: var(--green-deep);
  padding: 3px 10px;
  border-radius: 6px;
  font-weight: 600;
}
.pickup-card .pu-meta .date { color: var(--text-mute); }
.pickup-card .pu-excerpt {
  font-size: 15px;
  color: var(--text-soft);
  line-height: 2;
  margin-bottom: 24px;
}
.pickup-loading {
  min-height: 300px;
  background: var(--ivory);
  border-radius: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-mute);
  font-size: 14px;
}
@media (max-width: 800px) {
  .pickup-card { grid-template-columns: 1fr; padding: 32px; }
}

.category-nav {
  background: var(--ivory);
  padding: 60px 0;
}
.cat-tabs {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
}
.cat-tab {
  padding: 12px 24px;
  background: #fff;
  border-radius: 999px;
  font-size: 14px;
  color: var(--brown-deep);
  border: 1.5px solid var(--line);
  cursor: pointer;
  transition: all .3s var(--ease);
  font-family: inherit;
}
.cat-tab.active {
  background: var(--brown);
  color: #fff;
  border-color: var(--brown);
}
.cat-tab:hover:not(.active) {
  border-color: var(--brown-soft);
  background: var(--beige);
}

.article-list-sec { background: #fff; padding: 100px 0; }
.article-list-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  min-height: 200px;
}
.al-card {
  background: #fff;
  border-radius: 20px;
  overflow: hidden;
  border: 1px solid var(--line-soft);
  transition: all .4s var(--ease);
}
.al-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.al-thumb { aspect-ratio: 16/10; overflow: hidden; background: var(--beige); }
.al-thumb svg, .al-thumb img { width: 100%; height: 100%; display: block; object-fit: cover; }
.al-body { padding: 24px; }
.al-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 12px; }
.al-meta .cat { background: var(--green-soft); color: var(--green-deep); padding: 3px 10px; border-radius: 6px; font-weight: 600; }
.al-meta .date { color: var(--text-mute); }
.al-title { font-size: 16px; line-height: 1.7; color: var(--brown-deep); font-weight: 500; }
@media (max-width: 900px) { .article-list-grid { grid-template-columns: 1fr; max-width: 500px; margin-left: auto; margin-right: auto; } }

.list-empty {
  display: none;
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 24px;
  color: var(--text-mute);
  font-size: 15px;
  background: var(--ivory);
  border-radius: 20px;
}

.popular-sec { background: var(--ivory); padding: 100px 0; }
.popular-list { max-width: 780px; margin: 56px auto 0; }
.pop-item {
  display: grid;
  grid-template-columns: 40px 1fr;
  gap: 24px;
  padding: 24px 0;
  border-bottom: 1px dashed var(--line);
  align-items: center;
  transition: all .3s var(--ease);
}
.pop-item:hover { padding-left: 8px; }
.pop-item:last-child { border-bottom: 0; }
.pop-num {
  font-family: 'Zen Maru Gothic', sans-serif;
  font-size: 28px;
  color: var(--orange);
  font-weight: 700;
  line-height: 1;
}
.pop-item h3 { font-size: 16px; color: var(--brown-deep); line-height: 1.7; margin-bottom: 6px; }
.pop-item .pop-meta { font-size: 12px; color: var(--text-mute); }

.pagination {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 56px;
}
.pagination a {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 12px;
  background: #fff;
  border: 1px solid var(--line);
  color: var(--brown-deep);
  font-weight: 500;
  transition: all .3s var(--ease);
}
.pagination a.current, .pagination a:hover {
  background: var(--brown);
  color: #fff;
  border-color: var(--brown);
  opacity: 1;
}

.related-cta { background: linear-gradient(135deg, #FFF6E9 0%, #EEF2E5 100%); padding: 100px 0; }
.related-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; max-width: 900px; margin: 56px auto 0; }
.related-card {
  background: #fff;
  border-radius: 20px;
  padding: 32px;
  display: flex;
  gap: 20px;
  align-items: center;
  transition: all .3s var(--ease);
}
.related-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.related-card .r-icon { font-size: 40px; }
.related-card h3 { font-size: 18px; color: var(--brown-deep); margin-bottom: 6px; }
.related-card p { font-size: 13px; color: var(--text-soft); }
@media (max-width: 700px) { .related-grid { grid-template-columns: 1fr; } }

.lab-generated {
  text-align: center;
  font-size: 12px;
  color: var(--text-mute);
  padding: 0 32px 16px;
  letter-spacing: 0.06em;
}
/* 記事レンダー要素の登場アニメーション */
.lab-appear {
  opacity: 0;
  transform: translateY(16px);
  animation: labFadeIn .7s var(--ease) forwards;
}
@keyframes labFadeIn {
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
