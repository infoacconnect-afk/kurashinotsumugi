<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Lab responsive regression fixture</title><style>body{margin:16px;font:16px system-ui}button{font:inherit;margin:4px;padding:8px}iframe{display:block;border:1px solid #777;width:393px;height:720px}pre{white-space:pre-wrap;max-width:1100px}</style><h1>Lab responsive regression fixture</h1><p>Preview-only temporary test fixture. No form submissions.</p><div id="widths"><button data-width="320">320px</button><button data-width="360">360px</button><button data-width="393">393px</button><button data-width="430">430px</button><button data-width="800">800px</button><button data-width="1024">1024px</button></div><button id="height">Toggle viewport height</button><button id="pickup">Scroll to pickup</button><button id="report">Inspect layout</button><pre id="results">Loading</pre><iframe id="site" title="Lab viewport" src="/lab.html"></iframe><script>
const frame=document.querySelector('#site'),output=document.querySelector('#results');
let previousTitleNode=null;
function inspect(){const d=frame.contentDocument,w=frame.contentWindow,card=d.querySelector('.pickup-card'),body=card?.lastElementChild,title=card?.querySelector('h2'),excerpt=card?.querySelector('.pu-excerpt');if(!title){output.textContent='Waiting for CMS';return;}const r=card.getBoundingClientRect(),s=w.getComputedStyle(card),right=r.right-parseFloat(s.paddingRight),children=[...card.children].map(e=>({class:e.className,width:e.getBoundingClientRect().width,right:e.getBoundingClientRect().right}));let clipped=[];for(const root of [title,excerpt]){const walker=d.createTreeWalker(root,4);let n;while(n=walker.nextNode()){const range=d.createRange();range.selectNodeContents(n);for(const r of range.getClientRects())if(r.right>right+1||r.left<card.getBoundingClientRect().left-1)clipped.push(n.textContent);}}output.textContent=JSON.stringify({viewport:w.innerWidth,height:w.innerHeight,cardWidth:r.width,contentWidth:card.clientWidth-parseFloat(s.paddingLeft)-parseFloat(s.paddingRight),children,titleFont:w.getComputedStyle(title).fontSize,excerptFont:w.getComputedStyle(excerpt).fontSize,textSizeAdjust:w.getComputedStyle(d.documentElement).getPropertyValue('-webkit-text-size-adjust'),clipped:[...new Set(clipped)],title:title.textContent,titleRebuilt:previousTitleNode!==null&&previousTitleNode!==title.firstChild},null,2);previousTitleNode=title.firstChild;}
frame.addEventListener('load',()=>setTimeout(inspect,1600));
document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';setTimeout(inspect,600);});
document.querySelector('#height').onclick=()=>{frame.style.height=frame.clientHeight>700?'600px':'780px';setTimeout(inspect,600);};
document.querySelector('#pickup').onclick=()=>{const w=frame.contentWindow,d=frame.contentDocument;w.scrollTo(0,d.querySelector('.pickup-card').getBoundingClientRect().top+w.scrollY-100);setTimeout(inspect,600);};
document.querySelector('#report').onclick=inspect;
</script></html>
